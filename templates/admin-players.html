<!DOCTYPE html>
<html>
<head>
    <title>Spelersbeheer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <h1>Spelersbeheer Eerste Elftal</h1>
        <a href="/admin" class="btn btn-secondary mb-3">Terug naar Dashboard</a>

        <div class="card mb-4">
            <div class="card-header">Nieuwe Speler / Wijzigen</div>
            <div class="card-body">
                <form action="/admin/save-player" method="POST" enctype="multipart/form-data">
                    <input type="hidden" name="id" id="edit-id">
                    <div class="row">
                        <div class="col-md-2">
                            <input type="number" name="rugnummer" id="edit-rugnummer" class="form-control" placeholder="Nr" required>
                        </div>
                        <div class="col-md-4">
                            <input type="text" name="naam" id="edit-naam" class="form-control" placeholder="Naam" required>
                        </div>
                        <div class="col-md-3">
                            <label>Portret</label>
                            <input type="file" name="foto_profiel" class="form-control">
                        </div>
                        <div class="col-md-3">
                            <label>Actie/Gebaar</label>
                            <input type="file" name="foto_actie" class="form-control">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary mt-3">Opslaan</button>
                    <button type="button" onclick="resetForm()" class="btn btn-outline-secondary mt-3">Reset</button>
                </form>
            </div>
        </div>

        <table class="table table-striped bg-white">
            <thead><tr><th>Nr</th><th>Naam</th><th>Foto's</th><th>Acties</th></tr></thead>
            <tbody>
                {% for speler in spelers %}
                <tr>
                    <td>{{ speler.rugnummer }}</td>
                    <td>{{ speler.naam }}</td>
                    <td>
                        {% if speler.foto_profiel %}<span class="badge bg-success">Portret</span>{% endif %}
                        {% if speler.foto_actie %}<span class="badge bg-info">Actie</span>{% endif %}
                    </td>
                    <td>
                        <button class="btn btn-sm btn-warning" onclick='editSpeler({{ speler|tojson }})'>Bewerk</button>
                        <a href="/admin/delete-player/{{ speler.id }}" class="btn btn-sm btn-danger" onclick="return confirm('Zeker weten?')">Verwijder</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    <script>
        function editSpeler(data) {
            document.getElementById('edit-id').value = data.id;
            document.getElementById('edit-rugnummer').value = data.rugnummer;
            document.getElementById('edit-naam').value = data.naam;
        }
        function resetForm() {
            document.getElementById('edit-id').value = '';
            document.getElementById('edit-rugnummer').value = '';
            document.getElementById('edit-naam').value = '';
        }
    </script>
</body>
</html>
